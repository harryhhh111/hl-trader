# hl-trader 配置示例（无秘密）。复制为 hl-trader.toml 后填写。

# 实际交易账户地址（公共地址；查询与下单都指向此账户，不要用 agent 地址）。
account_address = "0x0000000000000000000000000000000000000000"

# 仓库外 agent 私钥文件路径。要求：非符号链接、所有者为当前用户、权限 0o600 或更严。
# 主钱包授权请在可信设备上完成；本工具不接收助记词。
secret_file = "/绝对路径/到/agent-testnet.key"

# 单笔名义金额本地上限（USD）。这是防误操作的本地限制，不是账户级资金保护。
max_notional_usd = "50"

# 回执目录（默认 .hl-trader；权限 0700，回执 0600，不进 Git）。
# receipt_dir = ".hl-trader"
