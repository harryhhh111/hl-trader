[package]
name = "hl-trader"
version = "0.1.0"
edition = "2024"
description = "Hyperliquid testnet minimal CLI: market/account/order/status/cancel"
license = "LicenseRef-Custom" # 项目自身许可证待用户确认，见 docs/archive/MVP_PLAN.md §2

[dependencies]
hypersdk = "=0.3.0"
clap = { version = "4.5", features = ["derive"] }
rust_decimal = { version = "1.37", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.13", features = ["json"] }
thiserror = "2"
anyhow = "1"
toml = "0.9"
zeroize = "1"
scraper = { version = "=0.27.0", default-features = false }
sha2 = "0.10"

[dev-dependencies]
httpmock = "0.8"

[profile.release]
lto = true
codegen-units = 1
